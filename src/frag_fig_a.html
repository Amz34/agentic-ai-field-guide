<figure class="diag">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 258" role="img" aria-label="The agentic loop diagram">
<defs>
<marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#0E7A46"/></marker>
</defs>
<g font-family="Lato,Arial,sans-serif">
<rect x="18" y="16" width="150" height="58" rx="10" fill="#FFFFFF" stroke="#0E7A46" stroke-width="1.5"/>
<text x="93" y="41" text-anchor="middle" font-size="17" font-weight="700" fill="#17392F">1 · Objective</text>
<text x="93" y="60" text-anchor="middle" font-size="13" fill="#5A6F63">task or trigger assigned</text>
<rect x="207" y="16" width="150" height="58" rx="10" fill="#FFFFFF" stroke="#0E7A46" stroke-width="1.5"/>
<text x="282" y="41" text-anchor="middle" font-size="17" font-weight="700" fill="#17392F">2 · Plan</text>
<text x="282" y="60" text-anchor="middle" font-size="13" fill="#5A6F63">break into concrete steps</text>
<rect x="396" y="16" width="150" height="58" rx="10" fill="#FFFFFF" stroke="#0E7A46" stroke-width="1.5"/>
<text x="471" y="41" text-anchor="middle" font-size="17" font-weight="700" fill="#17392F">3 · Act</text>
<text x="471" y="60" text-anchor="middle" font-size="13" fill="#5A6F63">tools · data · APIs</text>
<rect x="585" y="16" width="150" height="58" rx="10" fill="#FFFFFF" stroke="#0E7A46" stroke-width="1.5"/>
<text x="660" y="41" text-anchor="middle" font-size="17" font-weight="700" fill="#17392F">4 · Verify</text>
<text x="660" y="60" text-anchor="middle" font-size="13" fill="#5A6F63">check result against intent</text>
<rect x="774" y="16" width="150" height="58" rx="10" fill="#0B3B2E" stroke="#0B3B2E" stroke-width="1.5"/>
<text x="849" y="41" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">5 · Hand off</text>
<text x="849" y="60" text-anchor="middle" font-size="13" fill="#CDE5D8">deliver · log · escalate</text>
<line x1="168" y1="45" x2="203" y2="45" stroke="#0E7A46" stroke-width="2" marker-end="url(#arrA)"/>
<line x1="357" y1="45" x2="392" y2="45" stroke="#0E7A46" stroke-width="2" marker-end="url(#arrA)"/>
<line x1="546" y1="45" x2="581" y2="45" stroke="#0E7A46" stroke-width="2" marker-end="url(#arrA)"/>
<line x1="735" y1="45" x2="770" y2="45" stroke="#0E7A46" stroke-width="2" marker-end="url(#arrA)"/>
<path d="M660,74 V104 H282 V80" fill="none" stroke="#0E7A46" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrA)"/>
<text x="471" y="120" text-anchor="middle" font-size="13.5" font-style="italic" fill="#17392F">unexpected result — revise the plan</text>
<rect x="18" y="140" width="906" height="64" rx="12" fill="#FFFFFF" stroke="#0E7A46" stroke-width="1"/>
<text x="40" y="166" font-size="16" font-weight="700" fill="#0B3B2E">Guardrails on every loop</text>
<text x="40" y="190" font-size="14.5" fill="#17392F">approval gates for high-impact actions · data policy · spend budgets · full audit trail</text>
</g>
</svg>
<figcaption><b>Figure 1</b> — The agentic loop: plan, act, verify, hand off — with guardrails around every cycle.</figcaption>
</figure>
